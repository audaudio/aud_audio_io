name: aud_audio_io
description: "Audio device IO of the Audanika Audio Engine: enumeration, hot-plug, duplex multi-channel streams with timestamps; Oboe on Android, miniaudio elsewhere"
version: 0.5.2
publish_to: none
homepage: https://github.com/audaudio/aud_audio_io
repository: https://github.com/audaudio/aud_audio_io

environment:
  sdk: ^3.13.0

# The example resolves together with the package, so that upgrading the
# package upgrades the example too.
workspace:
  - example

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  aud_audio_core:
    git:
      url: git@github.com:audaudio/aud_audio_core.git
      tag_pattern: "{{version}}"
    version: ^0.6.2
  code_assets: ^2.1.0
  hooks: ^2.2.0
  jni: ^1.1.1
  jni_flutter: ^1.0.4+1
  logging: ^1.3.0
  meta: ^1.19.0
  native_toolchain_c: ^0.19.5

dev_dependencies:
  aud_audio_graph:
    git:
      url: git@github.com:audaudio/aud_audio_graph.git
      tag_pattern: "{{version}}"
    version: ^0.6.3
  dna_audanika: ^0.1.0
  ffigen: ^23.0.0
  flutter_lints: ^6.0.0
  helix: ^1.14.0
  jnigen: ^1.0.1
  # Within the test_api that flutter_test of the example pins.
  test: ^1.31.1